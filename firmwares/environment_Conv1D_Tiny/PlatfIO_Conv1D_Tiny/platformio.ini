[platformio]

; ============================================================================
; ESP32 LOLIN32 — original environment preserved
; Only the two platform flags were appended.
; ============================================================================
[env:lolin32_Conv1D_Tiny]
platform          = espressif32
board             = lolin32
framework         = arduino

upload_port       = COM6
monitor_port      = COM6
upload_speed      = 115200
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder, time
board_build.partitions = default.csv

lib_deps =

  ESP32Async/AsyncTCP @ ^3.4.7
  ESP32Async/ESPAsyncWebServer @ ^3.7.10
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.0.0
  adafruit/Adafruit INA219 @ ^1.2.3
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0

lib_archive = yes
lib_ldf_mode = chain+
build_unflags = -std=gnu++11
lib_extra_dirs = lib

build_flags =
  -Wall
  -O2
  -std=gnu++14
  -Ilib/flatbuffers/include
  -Ilib/tflite-micro
  -Ilib/tflite-micro/tensorflow
  -Ilib/tflite-micro/tensorflow/lite
  -Ilib/tflite-micro/tensorflow/lite/micro
  -Ilib/tflite-micro/tensorflow/lite/schema
  -Ilib/tflite-micro/tensorflow/lite/core/api
  -Ilib/tflite-micro/third_party/gemmlowp
  -Ilib/tflite-micro/third_party/ruy
  
; ============================================================================
; STM32F411RE — additional environment. It does not modify the ESP32 environment above.
; The model remains selected manually in the current include files.
; ============================================================================
[env:nucleo_f411re_Conv1D_Tiny]
platform          = ststm32
board             = nucleo_f411re
framework         = arduino

upload_protocol   = jlink
debug_tool        = jlink
debug_init_break  = tbreak setup

monitor_port      = COM8
monitor_speed     = 115200
monitor_filters   = time

lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
  adafruit/Adafruit INA219 @ ^1.2.3

; Prevent any display library from participating in the STM32 build.
lib_ignore =
  ESP8266 and ESP32 OLED driver for SSD1306 displays
  Adafruit SSD1306
  Adafruit GFX Library

lib_archive       = yes
lib_ldf_mode      = chain+
lib_compat_mode   = strict
build_unflags     = -std=gnu++11
lib_extra_dirs    = lib

build_flags =
  -Wall
  -O2
  -std=gnu++14

  -Ilib/flatbuffers/include
  -Ilib/tflite-micro
  -Ilib/tflite-micro/tensorflow
  -Ilib/tflite-micro/tensorflow/lite
  -Ilib/tflite-micro/tensorflow/lite/micro
  -Ilib/tflite-micro/tensorflow/lite/schema
  -Ilib/tflite-micro/tensorflow/lite/core/api
  -Ilib/tflite-micro/third_party/gemmlowp
  -Ilib/tflite-micro/third_party/ruy

  ; Explicit platform selection.
  -D LITEML_TARGET_ESP32=0
  -D LITEML_TARGET_STM32F411RE=1

  ; Peripherals unavailable or disabled on STM32.
  -D USE_OLED=0
  -D OLED_IN_FIELD=0
  -D OLED_IN_REPLAY=0
  -D USE_WIFI_TIME=0
  -D USE_BLUETOOTH=0

  ; Suporte a float em printf no STM32.
  -Wl,-u,_printf_float